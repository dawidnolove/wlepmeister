name: CI/CD Pipeline

on:
  # push:
  #   branches: [main]
  #   tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    uses: ./.github/workflows/check-package.yml
    secrets: inherit

  publish:
    needs: check
    if: success()
    # if: success() && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/python-publish.yml
    secrets: inherit
