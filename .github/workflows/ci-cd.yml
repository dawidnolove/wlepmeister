name: CI/CD Pipeline

on:
  # push:
  #   branches: [main]
  #   tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/check-package.yml
    secrets: inherit

  publish:
    needs: check
    if: success() && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-python-package.yml
    secrets: inherit
