[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wlepmeister"]

[tool.setuptools.package-dir]
"wlepmeister" = "src"

[project]
name = "wlepmeister"
version = "4.32"
description = "description"
authors = [{name = "dawidnolove", email = "dawpi007@gmail.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
"altgraph>=0.17.5",
"bcrypt>=5.0.0",
"blinker>=1.9.0",
"cabarchive>=0.2.4",
"click>=8.3.1",
"colorama>=0.4.6",
"cx_Freeze>=8.5.0",
"dnspython>=2.8.0",
"filelock>=3.20.0",
"Flask>=3.1.3",
"freeze-core>=0.4.2",
"itsdangerous>=2.2.0",
"Jinja2>=3.1.6",
"lief>=0.17.1",
"MarkupSafe>=3.0.3",
"packaging>=25.0",
"pefile>=2024.8.26",
"pillow>=12.0.0",
"pyinstaller>=6.17.0",
"pyinstaller-hooks-contrib>=2025.10",
"pymongo>=4.16.0",
"python-dotenv>=1.2.1",
# "python-msilib>=0.5.0",
"pywin32-ctypes>=0.2.3",
"setuptools>=80.9.0",
"striprtf>=0.0.29",
"Werkzeug>=3.1.6",
]

[project.scripts]
wlepmeister = "wlepmeister.src.main:main"
